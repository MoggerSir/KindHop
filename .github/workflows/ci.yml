name: CI
on:
  push:
    branches: [main, developers]
  pull_request:
    branches: [developers, main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kindhop
          POSTGRES_USER: kindhop
          POSTGRES_PASSWORD: kindhop
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kindhop" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - name: Migraciones (dos veces, deben ser idempotentes)
        env:
          DATABASE_URL: postgresql://kindhop:kindhop@localhost:5432/kindhop
        run: npm run db:migrate && npm run db:migrate
      - name: Seeds (dos veces) y tests del esquema contra PostgreSQL
        env:
          DATABASE_URL: postgresql://kindhop:kindhop@localhost:5432/kindhop
        run: npm run db:seed && npm run db:seed && npm test -w @kindhop/api
