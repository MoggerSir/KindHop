# Producción de KinHop en el VPS (KH-026). Vive en /opt/kinhop con su .env (600). Lo usa deploy/remote/deploy.sh.
# Ningún puerto publicado: el Caddy "edge" llega a `kinhop-web` por la red Docker `edge`; Postgres solo en la red interna.
name: kinhop

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kinhop
      POSTGRES_USER: kinhop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=40"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinhop -d kinhop"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    networks: [internal]
    logging: *logging

  api:
    image: kinhop-api:${KINHOP_TAG:?Define KINHOP_TAG}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3001"
      TRUST_PROXY: "1"
      DATABASE_URL: postgres://kinhop:${POSTGRES_PASSWORD}@db:5432/kinhop
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 384m
    networks:
      internal:
        aliases: [kinhop-api]
    logging: *logging

  # Se llama kinhop-web (no `web`) porque está en la red compartida `edge`: un nombre genérico chocaría con otros proyectos.
  kinhop-web:
    image: kinhop-web:${KINHOP_TAG}
    restart: unless-stopped
    depends_on: [api]
    mem_limit: 64m
    networks:
      internal: {}
      edge: {}
    logging: *logging

  # Cloudflare Tunnel (KH-026): salida hacia Cloudflare, sin puertos abiertos ni depender del Caddy edge compartido.
  # La ingress del túnel (gestionada en Cloudflare) apunta a http://kinhop-web:80 por la red interna.
  # /ready en :2000 responde 200 cuando hay conexiones con Cloudflare (lo usa la comprobación de salud).
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:-}
    depends_on: [kinhop-web]
    mem_limit: 128m
    networks: [internal]
    logging: *logging

networks:
  internal: {}
  edge:
    external: true
    name: edge

volumes:
  pgdata:
    name: kinhop_pgdata
