# Producción de KinHop en el VPS (KH-026). Vive en /opt/kinhop con su .env (600). Lo usa deploy/remote/deploy.sh.
# Ningún puerto publicado: el Caddy "edge" llega a `kinhop-web` por la red Docker `edge`; Postgres solo en la red interna.
name: kinhop

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kinhop
      POSTGRES_USER: kinhop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=40"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinhop -d kinhop"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    networks: [internal]
    logging: *logging

  api:
    image: kinhop-api:${KINHOP_TAG:?Define KINHOP_TAG}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3001"
      TRUST_PROXY: "1"
      DATABASE_URL: postgres://kinhop:${POSTGRES_PASSWORD}@db:5432/kinhop
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 384m
    networks: [internal]
    logging: *logging

  web:
    image: kinhop-web:${KINHOP_TAG}
    restart: unless-stopped
    depends_on: [api]
    mem_limit: 64m
    networks:
      internal: {}
      edge:
        aliases: [kinhop-web]
    logging: *logging

networks:
  internal: {}
  edge:
    external: true
    name: edge

volumes:
  pgdata:
    name: kinhop_pgdata
